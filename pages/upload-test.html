<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📤 Upload Test - iPhone</title>
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }
        
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        h1 {
            color: #007bff;
            text-align: center;
            margin-bottom: 30px;
        }
        
        .upload-area {
            border: 3px dashed #007bff;
            border-radius: 10px;
            padding: 40px 20px;
            text-align: center;
            margin: 20px 0;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .upload-area:hover {
            background: #f0f7ff;
        }
        
        .upload-area.dragover {
            background: #e3f2fd;
            border-color: #28a745;
        }
        
        .preview {
            max-width: 100%;
            margin: 20px auto;
            display: none;
        }
        
        .preview img {
            max-width: 100%;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }
        
        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            margin: 20px 0;
            transition: background 0.3s;
        }
        
        .btn:hover {
            background: #218838;
        }
        
        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }
        
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .progress {
            height: 10px;
            background: #e9ecef;
            border-radius: 5px;
            margin: 15px 0;
            overflow: hidden;
        }
        
        .progress-bar {
            height: 100%;
            background: #007bff;
            width: 0%;
            transition: width 0.3s;
        }
        
        .file-info {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📱 ทดสอบอัปโหลด iPhone</h1>
        
        <!-- Upload Area -->
        <div class="upload-area" id="uploadArea">
            <div style="font-size: 50px;">📁</div>
            <h3>ลากไฟล์วางที่นี่</h3>
            <p>หรือคลิกเพื่อเลือกไฟล์</p>
            <p style="font-size: 12px; color: #666;">รองรับ: JPG, PNG, GIF (สูงสุด 10MB)</p>
        </div>
        
        <!-- Hidden File Input -->
        <input type="file" id="fileInput" accept="image/*" capture="environment" style="display: none;">
        
        <!-- Preview -->
        <div class="preview" id="preview">
            <img id="previewImage" src="" alt="Preview">
        </div>
        
        <!-- File Info -->
        <div class="file-info" id="fileInfo" style="display: none;">
            <div><strong>ชื่อไฟล์:</strong> <span id="fileName"></span></div>
            <div><strong>ขนาด:</strong> <span id="fileSize"></span></div>
            <div><strong>ประเภท:</strong> <span id="fileType"></span></div>
        </div>
        
        <!-- Progress Bar -->
        <div class="progress" id="progressBar" style="display: none;">
            <div class="progress-bar" id="progressFill"></div>
        </div>
        
        <!-- Upload Button -->
        <button class="btn" id="uploadBtn" disabled>⏫ อัปโหลดไฟล์</button>
        
        <!-- Result -->
        <div class="result" id="result"></div>
        
        <!-- Test Buttons -->
        <div style="margin-top: 30px; text-align: center;">
            <button onclick="testSmallFile()" style="padding:10px; margin:5px; background:#6c757d; color:white; border:none; border-radius:5px;">
                ทดสอบไฟล์เล็ก
            </button>
            <button onclick="testLargeFile()" style="padding:10px; margin:5px; background:#6c757d; color:white; border:none; border-radius:5px;">
                ทดสอบไฟล์ใหญ่
            </button>
            <button onclick="testCamera()" style="padding:10px; margin:5px; background:#007bff; color:white; border:none; border-radius:5px;">
                📷 เปิดกล้อง
            </button>
        </div>
    </div>

    <script>
        // Elements
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const preview = document.getElementById('preview');
        const previewImage = document.getElementById('previewImage');
        const fileInfo = document.getElementById('fileInfo');
        const uploadBtn = document.getElementById('uploadBtn');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        const result = document.getElementById('result');
        
        // Current file
        let currentFile = null;
        
        // Event Listeners
        uploadArea.addEventListener('click', () => fileInput.click());
        
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });
        
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });
        
        uploadBtn.addEventListener('click', uploadFile);
        
        // Handle file selection
        function handleFile(file) {
            // Validate file
            if (!file.type.match('image.*')) {
                showResult('❌ กรุณาเลือกรูปภาพเท่านั้น', 'error');
                return;
            }
            
            if (file.size > 10 * 1024 * 1024) { // 10MB
                showResult('❌ ไฟล์ใหญ่เกิน 10MB', 'error');
                return;
            }
            
            currentFile = file;
            
            // Show file info
            document.getElementById('fileName').textContent = file.name;
            document.getElementById('fileSize').textContent = formatBytes(file.size);
            document.getElementById('fileType').textContent = file.type;
            fileInfo.style.display = 'block';
            
            // Show preview
            const reader = new FileReader();
            reader.onload = (e) => {
                previewImage.src = e.target.result;
                preview.style.display = 'block';
            };
            reader.readAsDataURL(file);
            
            // Enable upload button
            uploadBtn.disabled = false;
            uploadBtn.textContent = `⏫ อัปโหลด (${formatBytes(file.size)})`;
            
            // Hide previous result
            result.style.display = 'none';
            
            console.log('📁 File selected:', file.name, formatBytes(file.size), file.type);
        }
        
        // Upload file
        function uploadFile() {
            if (!currentFile) return;
            
            // Reset
            result.style.display = 'none';
            progressBar.style.display = 'block';
            progressFill.style.width = '0%';
            uploadBtn.disabled = true;
            uploadBtn.textContent = 'กำลังอัปโหลด...';
            
            console.log('📤 Starting upload...');
            
            // Create FormData
            const formData = new FormData();
            formData.append('image', currentFile);
            formData.append('timestamp', new Date().toISOString());
            formData.append('device', 'iPhone');
            formData.append('userAgent', navigator.userAgent);
            
            // Create XMLHttpRequest for progress tracking
            const xhr = new XMLHttpRequest();
            
            // Progress event
            xhr.upload.addEventListener('progress', (e) => {
                if (e.lengthComputable) {
                    const percent = Math.round((e.loaded / e.total) * 100);
                    progressFill.style.width = percent + '%';
                    console.log(`📊 Upload progress: ${percent}%`);
                }
            });
            
            // Load event (completed)
            xhr.addEventListener('load', () => {
                progressBar.style.display = 'none';
                uploadBtn.disabled = false;
                uploadBtn.textContent = '⏫ อัปโหลดสำเร็จ';
                
                if (xhr.status === 200) {
                    showResult('✅ อัปโหลดสำเร็จ!', 'success');
                    console.log('✅ Upload successful:', xhr.responseText);
                } else {
                    showResult(`❌ อัปโหลดล้มเหลว (${xhr.status})`, 'error');
                    console.error('❌ Upload failed:', xhr.status, xhr.responseText);
                }
            });
            
            // Error event
            xhr.addEventListener('error', () => {
                progressBar.style.display = 'none';
                uploadBtn.disabled = false;
                uploadBtn.textContent = '⏫ อัปโหลดไฟล์';
                showResult('❌ การเชื่อมต่อล้มเหลว', 'error');
                console.error('❌ Network error');
            });
            
            // Timeout event
            xhr.addEventListener('timeout', () => {
                progressBar.style.display = 'none';
                uploadBtn.disabled = false;
                uploadBtn.textContent = '⏫ อัปโหลดไฟล์';
                showResult('❌ หมดเวลาการเชื่อมต่อ', 'error');
                console.error('❌ Request timeout');
            });
            
            // Configure and send request
            // เปลี่ยน URL เป็น endpoint จริงของคุณ
            const uploadURL = '/api/upload'; // เปลี่ยนตรงนี้
            
            xhr.open('POST', uploadURL);
            xhr.timeout = 30000; // 30 seconds
            xhr.send(formData);
            
            console.log(`📡 Sending to: ${uploadURL}`);
        }
        
        // Test functions
        function testSmallFile() {
            console.log('🧪 Testing small file upload...');
            
            // Create small test file
            const smallFile = new File(
                ['Small test file content'], 
                'test-small.txt', 
                { type: 'text/plain' }
            );
            
            handleFile(smallFile);
            
            // Auto upload after 1 second
            setTimeout(uploadFile, 1000);
        }
        
        function testLargeFile() {
            console.log('🧪 Testing large file upload...');
            
            // Create larger test file (1MB)
            const content = 'X'.repeat(1024 * 1024); // 1MB
            const largeFile = new File(
                [content], 
                'test-large.txt', 
                { type: 'text/plain' }
            );
            
            handleFile(largeFile);
            showResult('⚠️ ไฟล์ทดสอบขนาด 1MB - กรุณากดอัปโหลด', 'error');
        }
        
        function testCamera() {
            console.log('📷 Opening camera...');
            
            // Create camera input
            const cameraInput = document.createElement('input');
            cameraInput.type = 'file';
            cameraInput.accept = 'image/*';
            cameraInput.capture = 'environment';
            
            cameraInput.onchange = (e) => {
                if (e.target.files.length > 0) {
                    handleFile(e.target.files[0]);
                }
            };
            
            cameraInput.click();
        }
        
        // Utility functions
        function formatBytes(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }
        
        function showResult(message, type) {
            result.textContent = message;
            result.className = 'result ' + type;
            result.style.display = 'block';
            
            // Scroll to result
            result.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
        
        // Log device info
        console.log('📱 Device:', navigator.userAgent);
        console.log('🌐 Online:', navigator.onLine);
        console.log('📍 URL:', window.location.href);
    </script>
</body>
</html>
