<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>🔧 Debug Upload - iPhone</title>
    <link rel="stylesheet" href="css/debug-styles.css">
    <style>
        /* Fix iPhone zoom */
        input, select, textarea {
            font-size: 16px !important;
        }
        
        /* Prevent double-tap zoom */
        * {
            touch-action: manipulation;
        }
    </style>
</head>
<body>
    <div class="debug-container">
        <h1>📱 iPhone Upload Debugger</h1>
        <p>URL: <code id="current-url"></code></p>
        
        <!-- Device Info -->
        <div class="info-card">
            <h3>📊 ข้อมูลอุปกรณ์</h3>
            <div id="device-info"></div>
        </div>
        
        <!-- Test Sections -->
        <div class="test-section">
            <h3>🧪 ทดสอบ Upload</h3>
            
            <!-- Test 1: Basic File Input -->
            <div class="test-card">
                <h4>Test 1: อัปโหลดธรรมดา</h4>
                <input type="file" id="test1" accept="image/*" class="file-input">
                <button onclick="testBasicUpload()" class="test-btn">ทดสอบ</button>
                <div id="result1" class="result"></div>
            </div>
            
            <!-- Test 2: Camera Capture -->
            <div class="test-card">
                <h4>Test 2: ถ่ายภาพจากกล้อง</h4>
                <input type="file" id="test2" accept="image/*" capture="environment" class="file-input">
                <button onclick="testCameraUpload()" class="test-btn">เปิดกล้อง</button>
                <div id="result2" class="result"></div>
            </div>
            
            <!-- Test 3: Multiple Files -->
            <div class="test-card">
                <h4>Test 3: หลายไฟล์</h4>
                <input type="file" id="test3" accept="image/*" multiple class="file-input">
                <button onclick="testMultipleUpload()" class="test-btn">เลือกหลายไฟล์</button>
                <div id="result3" class="result"></div>
            </div>
        </div>
        
        <!-- Network Test -->
        <div class="test-section">
            <h3>📡 ทดสอบเครือข่าย</h3>
            <button onclick="testNetwork()" class="network-btn">ทดสอบการเชื่อมต่อ</button>
            <button onclick="testAPIConnection()" class="network-btn">ทดสอบ API</button>
            <div id="network-result" class="result"></div>
        </div>
        
        <!-- Debug Console -->
        <div class="console-section">
            <h3>📝 Debug Console</h3>
            <div class="console-controls">
                <button onclick="clearConsole()" class="console-btn">ล้าง</button>
                <button onclick="exportLogs()" class="console-btn">บันทึก Logs</button>
                <button onclick="toggleConsole()" class="console-btn">แสดง/ซ่อน</button>
            </div>
            <div id="debug-console" class="console-output"></div>
        </div>
        
        <!-- Action Buttons -->
        <div class="action-buttons">
            <button onclick="runAllTests()" class="action-btn primary">▶️ รันทุกการทดสอบ</button>
            <button onclick="location.href='index.html'" class="action-btn">🏠 กลับหน้าแรก</button>
            <button onclick="location.reload()" class="action-btn">🔄 รีเฟรช</button>
        </div>
    </div>

    <!-- Mobile Debug Panel -->
    <div id="mobile-debug-panel" class="mobile-panel">
        <div class="panel-header">
            <span>🐛 Mobile Debug</span>
            <button onclick="toggleMobilePanel()" class="panel-close">×</button>
        </div>
        <div id="mobile-console" class="panel-content"></div>
    </div>

    <!-- Scripts -->
    <script src="js/mobile-debug.js"></script>
    <script src="js/eruda-loader.js"></script>
    <script>
        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            // Show current URL
            document.getElementById('current-url').textContent = window.location.href;
            
            // Show device info
            displayDeviceInfo();
            
            // Auto start Eruda if ?debug
            if (window.location.search.includes('debug')) {
                initEruda();
            }
            
            // Log page load
            debugLog('🚀 Debug page loaded');
            debugLog('User Agent: ' + navigator.userAgent);
            debugLog('Touch screen: ' + ('ontouchstart' in window));
        });
        
        // Display device info
        function displayDeviceInfo() {
            const infoDiv = document.getElementById('device-info');
            const info = {
                'Platform': navigator.platform,
                'User Agent': navigator.userAgent,
                'Screen': window.screen.width + '×' + window.screen.height,
                'Touch': ('ontouchstart' in window) ? '✅ มี' : '❌ ไม่มี',
                'Cookies': navigator.cookieEnabled ? '✅ เปิด' : '❌ ปิด',
                'Online': navigator.onLine ? '✅ ออนไลน์' : '❌ ออฟไลน์',
                'Memory': navigator.deviceMemory ? navigator.deviceMemory + ' GB' : 'ไม่ทราบ',
                'Connection': navigator.connection ? navigator.connection.effectiveType : 'ไม่ทราบ'
            };
            
            let html = '<table class="info-table">';
            for (const [key, value] of Object.entries(info)) {
                html += `<tr><td><strong>${key}:</strong></td><td>${value}</td></tr>`;
            }
            html += '</table>';
            infoDiv.innerHTML = html;
        }
        
        // Test functions
        function testBasicUpload() {
            debugLog('🧪 เริ่มทดสอบ Upload ธรรมดา');
            const input = document.getElementById('test1');
            input.click();
            
            input.onchange = function(e) {
                const file = e.target.files[0];
                if (file) {
                    const result = `✅ เลือกไฟล์ได้: ${file.name} (${formatBytes(file.size)})`;
                    document.getElementById('result1').innerHTML = result;
                    debugLog(result);
                    testFileUpload(file, 'test1');
                } else {
                    document.getElementById('result1').innerHTML = '❌ ไม่ได้เลือกไฟล์';
                    debugLog('❌ ไม่ได้เลือกไฟล์');
                }
            };
        }
        
        function testCameraUpload() {
            debugLog('📷 เปิดกล้องถ่ายรูป');
            const input = document.getElementById('test2');
            input.click();
            
            input.onchange = function(e) {
                const file = e.target.files[0];
                if (file) {
                    const result = `✅ ถ่ายภาพได้: ${file.name} (${formatBytes(file.size)})`;
                    document.getElementById('result2').innerHTML = result;
                    debugLog(result);
                    testFileUpload(file, 'test2');
                } else {
                    document.getElementById('result2').innerHTML = '❌ ไม่ได้ถ่ายภาพ';
                    debugLog('❌ ไม่ได้ถ่ายภาพ');
                }
            };
        }
        
        function testMultipleUpload() {
            debugLog('📂 ทดสอบเลือกหลายไฟล์');
            const input = document.getElementById('test3');
            input.click();
            
            input.onchange = function(e) {
                const files = e.target.files;
                if (files.length > 0) {
                    const result = `✅ เลือกได้ ${files.length} ไฟล์`;
                    document.getElementById('result3').innerHTML = result;
                    debugLog(result);
                    
                    for (let i = 0; i < files.length; i++) {
                        debugLog(`  📄 ${i+1}. ${files[i].name} (${formatBytes(files[i].size)})`);
                    }
                } else {
                    document.getElementById('result3').innerHTML = '❌ ไม่ได้เลือกไฟล์';
                    debugLog('❌ ไม่ได้เลือกไฟล์');
                }
            };
        }
        
        function testFileUpload(file, testId) {
            debugLog(`📤 เริ่มอัปโหลดไฟล์: ${file.name}`);
            
            const formData = new FormData();
            formData.append('file', file);
            formData.append('test', testId);
            formData.append('timestamp', new Date().toISOString());
            
            // Test with httpbin first
            debugLog('🌐 ทดสอบอัปโหลดไปยัง httpbin.org...');
            
            fetch('https://httpbin.org/post', {
                method: 'POST',
                body: formData
            })
            .then(response => {
                debugLog(`📡 Response Status: ${response.status}`);
                return response.json();
            })
            .then(data => {
                debugLog('✅ อัปโหลดทดสอบสำเร็จ!');
                debugLog(`📦 ขนาด response: ${JSON.stringify(data).length} bytes`);
                
                // Now test with your actual API
                testYourAPIUpload(file);
            })
            .catch(error => {
                debugLog(`❌ การอัปโหลดทดสอบล้มเหลว: ${error.message}`);
            });
        }
        
        function testYourAPIUpload(file) {
            debugLog('🔗 ทดสอบอัปโหลดไปยัง API ของคุณ...');
            
            // เปลี่ยนเป็น endpoint จริงของคุณ
            const yourEndpoint = '/api/upload'; // เปลี่ยนตรงนี้
            
            const formData = new FormData();
            formData.append('image', file);
            formData.append('debug', 'true');
            
            fetch(yourEndpoint, {
                method: 'POST',
                body: formData
            })
            .then(response => {
                const status = `สถานะ API: ${response.status} ${response.statusText}`;
                debugLog(status);
                
                if (response.ok) {
                    return response.json().then(data => {
                        debugLog('✅ API อัปโหลดสำเร็จ!');
                        debugLog(`📊 Response: ${JSON.stringify(data).substring(0, 100)}...`);
                    });
                } else {
                    return response.text().then(text => {
                        debugLog(`❌ API Error: ${text.substring(0, 200)}`);
                    });
                }
            })
            .catch(error => {
                debugLog(`❌ API Connection Error: ${error.message}`);
            });
        }
        
        function testNetwork() {
            debugLog('📡 ทดสอบการเชื่อมต่อเครือข่าย...');
            
            const startTime = Date.now();
            
            fetch('https://httpbin.org/get')
                .then(response => {
                    const time = Date.now() - startTime;
                    const result = `✅ เชื่อมต่อได้ (${time}ms) - Status: ${response.status}`;
                    document.getElementById('network-result').innerHTML = result;
                    debugLog(result);
                })
                .catch(error => {
                    const result = `❌ ไม่สามารถเชื่อมต่อได้: ${error.message}`;
                    document.getElementById('network-result').innerHTML = result;
                    debugLog(result);
                });
        }
        
        function testAPIConnection() {
            debugLog('🔌 ทดสอบเชื่อมต่อ API...');
            
            // เปลี่ยนเป็น endpoint จริงของคุณ
            const yourAPI = '/api/test'; // เปลี่ยนตรงนี้
            
            fetch(yourAPI)
                .then(response => {
                    const result = `✅ API ตอบกลับ: ${response.status}`;
                    document.getElementById('network-result').innerHTML += '<br>' + result;
                    debugLog(result);
                })
                .catch(error => {
                    const result = `❌ API ไม่ตอบกลับ: ${error.message}`;
                    document.getElementById('network-result').innerHTML += '<br>' + result;
                    debugLog(result);
                });
        }
        
        function runAllTests() {
            debugLog('▶️ เริ่มรันการทดสอบทั้งหมด...');
            testNetwork();
            setTimeout(testBasicUpload, 1000);
            setTimeout(testAPIConnection, 2000);
        }
        
        // Utility functions
        function formatBytes(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }
        
        function toggleConsole() {
            const consoleEl = document.getElementById('debug-console');
            consoleEl.style.display = consoleEl.style.display === 'none' ? 'block' : 'none';
        }
        
        function clearConsole() {
            document.getElementById('debug-console').innerHTML = '';
            debugLog('🧹 ล้าง Console แล้ว');
        }
        
        function exportLogs() {
            const logs = document.getElementById('debug-console').innerText;
            const blob = new Blob([logs], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `debug-logs-${new Date().toISOString().slice(0, 10)}.txt`;
            a.click();
            debugLog('💾 บันทึก logs เรียบร้อย');
        }
        
        function toggleMobilePanel() {
            const panel = document.getElementById('mobile-debug-panel');
            panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
        }
    </script>
</body>
</html>
