<!DOCTYPE html>
<html>
<head>
    <title>Image Debug - Mobile</title>
    <style>
        /* เพิ่มตามชอบ */
    </style>
</head>
<body>
    <h1>🖼️ Mobile Image Debug</h1>
    
    <input type="file" accept="image/*" id="imageInput">
    
    <div id="fileInfo"></div>
    <div id="testResults"></div>
    <div id="debugLog"></div>
    
    <script>
        document.getElementById('imageInput').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            // 1. Log ข้อมูลไฟล์เต็มๆ
            log('=== FILE ANALYSIS ===');
            log(`Name: ${file.name}`);
            log(`Size: ${file.size} bytes (${file.size/1024}KB)`);
            log(`Type: "${file.type}"`);
            log(`Last Modified: ${new Date(file.lastModified).toISOString()}`);
            
            // 2. ตรวจสอบ MIME type จริง
            const realType = await detectRealMimeType(file);
            log(`Detected MIME: ${realType}`);
            
            // 3. ตรวจสอบว่าเป็นรูปภาพจริงไหม
            const isImage = await testIfImage(file);
            log(`Is valid image: ${isImage}`);
            
            // 4. ตรวจสอบ EXIF data
            const hasExif = await checkForExif(file);
            log(`Has EXIF data: ${hasExif}`);
            
            // 5. ทดสอบอ่านเป็น DataURL (เหมือนในโค้ดจริง)
            log('=== TESTING FILE READER ===');
            try {
                const dataUrl = await readAsDataURL(file);
                log(`DataURL created: ${dataUrl.substring(0, 50)}...`);
            } catch (error) {
                log(`❌ FileReader error: ${error.message}`);
            }
            
            // 6. ทดสอบสร้าง FormData
            log('=== TESTING FORMDATA ===');
            try {
                const formData = new FormData();
                formData.append('image', file);
                
                // ตรวจสอบว่า FormData ทำงานได้ไหม
                let entryCount = 0;
                for (let entry of formData.entries()) {
                    entryCount++;
                }
                log(`FormData entries: ${entryCount}`);
            } catch (error) {
                log(`❌ FormData error: ${error.message}`);
            }
            
            // 7. ทดสอบ Upload จริง
            log('=== TESTING UPLOAD ===');
            await testUpload(file);
        });
        
        async function detectRealMimeType(file) {
            // อ่าน bytes แรกเพื่อตรวจสอบ MIME type จริง
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsArrayBuffer(file.slice(0, 4)); // อ่าน 4 bytes แรก
                reader.onload = (e) => {
                    const bytes = new Uint8Array(e.target.result);
                    let mime = 'unknown';
                    
                    // ตรวจสอบ magic bytes
                    if (bytes[0] === 0xFF && bytes[1] === 0xD8) mime = 'image/jpeg';
                    else if (bytes[0] === 0x89 && bytes[1] === 0x50) mime = 'image/png';
                    else if (bytes[0] === 0x47 && bytes[1] === 0x49) mime = 'image/gif';
                    else if (bytes[0] === 0x66 && bytes[1] === 0x74) mime = 'image/heic'; // 'ftyp'
                    
                    resolve(mime);
                };
            });
        }
        
        async function testIfImage(file) {
            return new Promise((resolve) => {
                const img = new Image();
                const url = URL.createObjectURL(file);
                
                img.onload = () => {
                    URL.revokeObjectURL(url);
                    resolve(true);
                };
                
                img.onerror = () => {
                    URL.revokeObjectURL(url);
                    resolve(false);
                };
                
                img.src = url;
            });
        }
        
        function readAsDataURL(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = () => reject(reader.error);
                reader.readAsDataURL(file);
            });
        }
        
        async function testUpload(file) {
            const formData = new FormData();
            formData.append('image', file);
            formData.append('debug', 'mobile_test');
            
            // ทดสอบกับ httpbin ก่อน (รองรับแน่นอน)
            try {
                const response = await fetch('https://httpbin.org/post', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                log(`✅ Upload to httpbin: SUCCESS (${response.status})`);
                log(`📦 Form data received by server: ${JSON.stringify(data.form)}`);
                
                // ทดสอบกับ API จริงของคุณต่อ
                testYourAPI(file);
                
            } catch (error) {
                log(`❌ Upload to httpbin FAILED: ${error.message}`);
            }
        }
        
        function testYourAPI(file) {
            // เปลี่ยนเป็น API URL จริงของคุณ
            const yourApiUrl = '/api/upload';
            
            const formData = new FormData();
            formData.append('image', file);
            
            fetch(yourApiUrl, {
                method: 'POST',
                body: formData
            })
            .then(async response => {
                log(`Your API response: ${response.status}`);
                if (!response.ok) {
                    const text = await response.text();
                    log(`❌ Your API error: ${text.substring(0, 200)}`);
                } else {
                    log(`✅ Your API: SUCCESS`);
                }
            })
            .catch(error => {
                log(`❌ Your API failed: ${error.message}`);
            });
        }
        
        function log(message) {
            const logDiv = document.getElementById('debugLog');
            logDiv.innerHTML += `<div>${message}</div>`;
            console.log(message);
        }
    </script>
</body>
</html>
