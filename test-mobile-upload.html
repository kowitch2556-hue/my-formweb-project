<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🔧 แก้ไข Upload มือถือ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            background: #000;
            color: white;
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 100%;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(135deg, #FF2D55 0%, #FF375F 100%);
            border-radius: 20px;
        }
        
        .header h1 {
            font-size: 1.8em;
            margin-bottom: 10px;
        }
        
        .test-section {
            background: #1c1c1e;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #2c2c2e;
        }
        
        .test-title {
            font-size: 1.3em;
            margin-bottom: 15px;
            color: #FFD60A;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .btn {
            width: 100%;
            padding: 18px;
            background: #007AFF;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 600;
            margin: 10px 0;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .btn:active {
            transform: scale(0.98);
            background: #0056CC;
        }
        
        .btn-danger {
            background: #FF453A;
        }
        
        .btn-success {
            background: #32D74B;
        }
        
        .btn-warning {
            background: #FF9F0A;
        }
        
        .result-box {
            background: #2c2c2e;
            border-radius: 12px;
            padding: 15px;
            margin-top: 15px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            max-height: 200px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
        
        .success {
            color: #32D74B;
            border-left: 4px solid #32D74B;
            padding-left: 10px;
        }
        
        .error {
            color: #FF453A;
            border-left: 4px solid #FF453A;
            padding-left: 10px;
        }
        
        .warning {
            color: #FF9F0A;
            border-left: 4px solid #FF9F0A;
            padding-left: 10px;
        }
        
        .progress {
            height: 6px;
            background: #3a3a3c;
            border-radius: 3px;
            margin: 15px 0;
            overflow: hidden;
        }
        
        .progress-bar {
            height: 100%;
            background: #32D74B;
            width: 0%;
            transition: width 0.3s;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin: 15px 0;
        }
        
        .stat {
            background: #2c2c2e;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 1.4em;
            font-weight: bold;
            color: white;
        }
        
        .stat-label {
            font-size: 12px;
            color: #8e8e93;
        }
        
        .file-info {
            background: #2c2c2e;
            padding: 15px;
            border-radius: 12px;
            margin: 15px 0;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔧 แก้ไข Upload มือถือ</h1>
            <p>ทดสอบและแก้ปัญหา Upload บนมือถือ</p>
        </div>
        
        <!-- ข้อมูลอุปกรณ์ -->
        <div class="test-section">
            <div class="test-title">📱 ข้อมูลมือถือ</div>
            <div class="stats">
                <div class="stat">
                    <div class="stat-value" id="device-type">-</div>
                    <div class="stat-label">อุปกรณ์</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="memory-info">-</div>
                    <div class="stat-label">Memory</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="network-type">-</div>
                    <div class="stat-label">เครือข่าย</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="protocol">-</div>
                    <div class="stat-label">Protocol</div>
                </div>
            </div>
        </div>
        
        <!-- ทดสอบปัญหาหลัก -->
        <div class="test-section">
            <div class="test-title">🔍 วินิจฉัยปัญหา</div>
            
            <button class="btn" onclick="testMemoryLimit()">
                🧠 ทดสอบ Memory Limit
            </button>
            
            <button class="btn btn-warning" onclick="testFileReaderLimit()">
                📖 ทดสอบ FileReader Limit
            </button>
            
            <button class="btn btn-danger" onclick="testNetworkIssues()">
                📡 ทดสอบ Network Issues
            </button>
            
            <div class="result-box" id="diagnostic-result"></div>
        </div>
        
        <!-- แก้ปัญหา Upload -->
        <div class="test-section">
            <div class="test-title">🚀 แก้ปัญหา Upload</div>
            
            <div class="file-info" id="file-info">
                <strong>ไฟล์ที่เลือก:</strong> <span id="file-name">-</span><br>
                <strong>ขนาด:</strong> <span id="file-size">-</span><br>
                <strong>ประเภท:</strong> <span id="file-type">-</span>
            </div>
            
            <input type="file" id="file-input" accept="image/*" style="display: none;">
            
            <button class="btn" onclick="selectFile()">
                📁 เลือกไฟล์ภาพ
            </button>
            
            <button class="btn btn-success" onclick="uploadWithMethod('chunk')">
                🔄 อัพโหลดแบบ Chunk
            </button>
            
            <button class="btn" onclick="uploadWithMethod('formdata')">
                📤 อัพโหลดแบบ FormData
            </button>
            
            <button class="btn btn-warning" onclick="uploadWithMethod('base64')">
                🔢 อัพโหลดแบบ Base64
            </button>
            
            <div class="progress" id="progress-container" style="display: none;">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            
            <div class="result-box" id="upload-result"></div>
        </div>
        
        <!-- ทดสอบ Solution -->
        <div class="test-section">
            <div class="test-title">✅ ทดสอบ Solution</div>
            
            <button class="btn btn-success" onclick="testCompressedUpload()">
                🗜️ อัพโหลดแบบบีบอัด
            </button>
            
            <button class="btn" onclick="testResumeUpload()">
                ⏯️ อัพโหลดแบบ Resume
            </button>
            
            <button class="btn btn-warning" onclick="testBackgroundUpload()">
                📱 อัพโหลดแบบ Background
            </button>
            
            <div class="result-box" id="solution-result"></div>
        </div>
        
        <!-- Log -->
        <div class="test-section">
            <div class="test-title">📋 Log</div>
            <button class="btn" onclick="clearLog()" style="background: #5e5ce6;">
                🗑️ ล้าง Log
            </button>
            <div class="result-box" id="log-output"></div>
        </div>
    </div>

    <script>
        // ====================================================
        // 🚨 MOBILE UPLOAD FIX
        // ====================================================
        
        const mobileUploadFix = {
            // State
            selectedFile: null,
            logs: [],
            isUploading: false,
            
            // Config
            CHUNK_SIZE: 512 * 1024, // 512KB สำหรับมือถือ
            MAX_FILE_SIZE: 10 * 1024 * 1024, // 10MB limit
            API_URL: 'https://script.google.com/macros/s/AKfycbz6pqVa04Xt0k_bDTy2jHbhShT4IUnZoJXTkOV6MNwWhNTCQMsmjp7y72c-sBfUFw4J/exec',
            
            // Initialize
            init: function() {
                this.log('🚀 Mobile Upload Fix Initialized', 'success');
                this.showDeviceInfo();
                this.setupEventListeners();
            },
            
            // แสดงข้อมูลอุปกรณ์
            showDeviceInfo: function() {
                // Device type
                const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
                document.getElementById('device-type').textContent = isMobile ? '📱' : '💻';
                
                // Memory info
                const memory = navigator.deviceMemory || 'ไม่ทราบ';
                document.getElementById('memory-info').textContent = memory + (memory !== 'ไม่ทราบ' ? 'GB' : '');
                
                // Network
                const connection = navigator.connection;
                if (connection) {
                    document.getElementById('network-type').textContent = 
                        connection.effectiveType || 'ไม่ทราบ';
                }
                
                // Protocol
                document.getElementById('protocol').textContent = window.location.protocol;
                
                this.log(`📱 อุปกรณ์: ${isMobile ? 'มือถือ' : 'คอมพิวเตอร์'}`, 'info');
                this.log(`🧠 Memory: ${memory}GB`, 'info');
                this.log(`📡 เครือข่าย: ${connection?.effectiveType || 'ไม่ทราบ'}`, 'info');
            },
            
            // Setup event listeners
            setupEventListeners: function() {
                const fileInput = document.getElementById('file-input');
                fileInput.addEventListener('change', (e) => {
                    this.handleFileSelect(e);
                });
                
                // ตรวจจับ network changes
                if (navigator.connection) {
                    navigator.connection.addEventListener('change', () => {
                        this.log(`📡 เปลี่ยนเครือข่าย: ${navigator.connection.effectiveType}`, 'warning');
                    });
                }
                
                // ตรวจจับ page visibility (สลับแอพ)
                document.addEventListener('visibilitychange', () => {
                    if (document.hidden) {
                        this.log('📱 ผู้ใช้สลับไปแอพอื่น', 'warning');
                    }
                });
            },
            
            // Handle file selection
            handleFileSelect: function(event) {
                const file = event.target.files[0];
                if (!file) return;
                
                this.selectedFile = file;
                
                // แสดงข้อมูลไฟล์
                const fileInfo = document.getElementById('file-info');
                fileInfo.style.display = 'block';
                document.getElementById('file-name').textContent = file.name;
                document.getElementById('file-size').textContent = this.formatBytes(file.size);
                document.getElementById('file-type').textContent = file.type;
                
                this.log(`📄 เลือกไฟล์: ${file.name}`, 'success');
                this.log(`📦 ขนาด: ${this.formatBytes(file.size)}`, 'info');
                
                // ตรวจสอบขนาดไฟล์
                if (file.size > this.MAX_FILE_SIZE) {
                    this.log(`⚠️ ไฟล์ใหญ่เกิน ${this.formatBytes(this.MAX_FILE_SIZE)}`, 'warning');
                    this.showAlert(`ไฟล์ใหญ่เกินกำหนด (${this.formatBytes(this.MAX_FILE_SIZE)})`);
                }
            },
            
            // ====================================================
            // 🔍 วินิจฉัยปัญหา
            // ====================================================
            
            // ทดสอบ Memory Limit
            testMemoryLimit: function() {
                this.log('🧠 ทดสอบ Memory Limit...', 'info');
                const resultBox = document.getElementById('diagnostic-result');
                
                // สร้างไฟล์ขนาดต่างๆ
                const tests = [
                    { size: 1 * 1024 * 1024, label: '1MB' },
                    { size: 5 * 1024 * 1024, label: '5MB' },
                    { size: 10 * 1024 * 1024, label: '10MB' },
                    { size: 20 * 1024 * 1024, label: '20MB' }
                ];
                
                let results = [];
                
                tests.forEach((test, index) => {
                    setTimeout(() => {
                        this.log(`🧪 ทดสอบ ${test.label}...`, 'info');
                        
                        try {
                            // สร้าง blob ขนาดใหญ่
                            const blob = new Blob([new ArrayBuffer(test.size)]);
                            const file = new File([blob], `test_${test.label}.bin`);
                            
                            const reader = new FileReader();
                            const startTime = Date.now();
                            
                            reader.onload = () => {
                                const duration = Date.now() - startTime;
                                results.push({
                                    size: test.label,
                                    success: true,
                                    time: duration,
                                    memory: 'OK'
                                });
                                
                                this.updateDiagnosticResults(results, resultBox);
                            };
                            
                            reader.onerror = (e) => {
                                results.push({
                                    size: test.label,
                                    success: false,
                                    time: null,
                                    memory: 'FAILED'
                                });
                                
                                this.updateDiagnosticResults(results, resultBox);
                                this.log(`❌ ${test.label}: Memory ไม่พอ`, 'error');
                            };
                            
                            reader.readAsDataURL(file);
                            
                        } catch (error) {
                            results.push({
                                size: test.label,
                                success: false,
                                time: null,
                                memory: 'ERROR'
                            });
                            
                            this.updateDiagnosticResults(results, resultBox);
                        }
                    }, index * 1000);
                });
            },
            
            updateDiagnosticResults: function(results, resultBox) {
                let html = '<strong>🧠 Memory Test Results:</strong><br><br>';
                
                results.forEach(result => {
                    const status = result.success ? '✅' : '❌';
                    const time = result.time ? `${result.time}ms` : 'FAILED';
                    
                    html += `${status} ${result.size}: ${time}<br>`;
                });
                
                // วิเคราะห์ผล
                const failedAt = results.find(r => !r.success);
                if (failedAt) {
                    html += `<br><div class="warning">⚠️ Memory Limit: ${failedAt.size}</div>`;
                    html += `<div class="warning">💡 แนะนำใช้ไฟล์ไม่เกิน ${failedAt.size}</div>`;
                } else {
                    html += `<br><div class="success">✅ Memory ดี ไม่มีปัญหา</div>`;
                }
                
                resultBox.innerHTML = html;
            },
            
            // ทดสอบ FileReader Limit
            testFileReaderLimit: function() {
                this.log('📖 ทดสอบ FileReader Limit...', 'info');
                const resultBox = document.getElementById('diagnostic-result');
                
                // ตรวจสอบ FileReader availability
                if (typeof FileReader === 'undefined') {
                    resultBox.innerHTML = '<div class="error">❌ FileReader ไม่พร้อมใช้งาน</div>';
                    return;
                }
                
                // ทดสอบพร้อมกันหลายไฟล์
                const testFiles = [];
                for (let i = 0; i < 3; i++) {
                    const blob = new Blob([new ArrayBuffer(1024 * 1024)]); // 1MB each
                    testFiles.push(new File([blob], `test_${i}.jpg`));
                }
                
                let completed = 0;
                let errors = 0;
                
                testFiles.forEach((file, index) => {
                    const reader = new FileReader();
                    
                    reader.onload = () => {
                        completed++;
                        this.log(`✅ FileReader ${index + 1} สำเร็จ`, 'success');
                        
                        if (completed === testFiles.length) {
                            resultBox.innerHTML = `
                                <div class="success">
                                    ✅ FileReader ทำงานได้ปกติ<br>
                                    📊 สำเร็จ: ${completed}/${testFiles.length}<br>
                                    ❌ ล้มเหลว: ${errors}
                                </div>
                            `;
                        }
                    };
                    
                    reader.onerror = () => {
                        errors++;
                        completed++;
                        this.log(`❌ FileReader ${index + 1} ล้มเหลว`, 'error');
                        
                        if (completed === testFiles.length) {
                            resultBox.innerHTML = `
                                <div class="${errors > 0 ? 'warning' : 'success'}">
                                    ${errors > 0 ? '⚠️' : '✅'} FileReader Test<br>
                                    📊 สำเร็จ: ${completed - errors}/${testFiles.length}<br>
                                    ❌ ล้มเหลว: ${errors}<br>
                                    ${errors > 0 ? '💡 อาจมีปัญหาเมื่ออ่านหลายไฟล์พร้อมกัน' : ''}
                                </div>
                            `;
                        }
                    };
                    
                    reader.readAsDataURL(file);
                });
            },
            
            // ทดสอบ Network Issues
            testNetworkIssues: function() {
                this.log('📡 ทดสอบ Network Issues...', 'info');
                const resultBox = document.getElementById('diagnostic-result');
                
                // ตรวจสอบการเชื่อมต่อ
                const isOnline = navigator.onLine;
                const connection = navigator.connection;
                
                let html = '<strong>📡 Network Diagnostics:</strong><br><br>';
                
                html += `🌐 Online: ${isOnline ? '✅' : '❌'}<br>`;
                
                if (connection) {
                    html += `📶 Type: ${connection.effectiveType || 'ไม่ทราบ'}<br>`;
                    html += `⚡ Downlink: ${connection.downlink || 'ไม่ทราบ'} Mbps<br>`;
                    html += `📊 RTT: ${connection.rtt || 'ไม่ทราบ'} ms<br>`;
                    html += `📡 Save Data: ${connection.saveData ? '✅' : '❌'}<br>`;
                }
                
                // ทดสอบ ping ไปยัง Google
                this.testPing().then(ping => {
                    html += `🏓 Ping: ${ping} ms<br>`;
                    
                    // วิเคราะห์
                    html += '<br><strong>📊 Analysis:</strong><br>';
                    
                    if (!isOnline) {
                        html += '<div class="error">❌ ออฟไลน์</div>';
                    } else if (connection?.effectiveType === 'slow-2g' || connection?.effectiveType === '2g') {
                        html += '<div class="warning">⚠️ เครือข่ายช้า ควรบีบอัดไฟล์</div>';
                    } else if (ping > 1000) {
                        html += '<div class="warning">⚠️ Ping สูง ควรเพิ่ม timeout</div>';
                    } else {
                        html += '<div class="success">✅ เครือข่ายปกติ</div>';
                    }
                    
                    resultBox.innerHTML = html;
                });
            },
            
            testPing: function() {
                return new Promise((resolve) => {
                    const start = Date.now();
                    const img = new Image();
                    
                    img.onload = img.onerror = () => {
                        const ping = Date.now() - start;
                        resolve(ping);
                    };
                    
                    img.src = 'https://www.google.com/favicon.ico?t=' + Date.now();
                    setTimeout(() => resolve(9999), 3000); // timeout 3 วินาที
                });
            },
            
            // ====================================================
            // 🚀 แก้ปัญหา Upload
            // ====================================================
            
            // เลือกไฟล์
            selectFile: function() {
                document.getElementById('file-input').click();
            },
            
            // อัพโหลดด้วยวิธีต่างๆ
            uploadWithMethod: function(method) {
                if (!this.selectedFile) {
                    this.showAlert('กรุณาเลือกไฟล์ก่อน');
                    return;
                }
                
                if (this.isUploading) {
                    this.log('⏳ กำลังอัพโหลดอยู่...', 'warning');
                    return;
                }
                
                this.isUploading = true;
                this.log(`🚀 เริ่มอัพโหลดด้วยวิธี: ${method}`, 'info');
                
                const resultBox = document.getElementById('upload-result');
                const progressContainer = document.getElementById('progress-container');
                const progressBar = document.getElementById('progress-bar');
                
                resultBox.innerHTML = '<div class="warning">กำลังเริ่มอัพโหลด...</div>';
                progressContainer.style.display = 'block';
                progressBar.style.width = '0%';
                
                switch(method) {
                    case 'chunk':
                        this.uploadWithChunks();
                        break;
                    case 'formdata':
                        this.uploadWithFormData();
                        break;
                    case 'base64':
                        this.uploadWithBase64();
                        break;
                }
            },
            
            // 1. อัพโหลดแบบ Chunk (แนะนำสำหรับมือถือ)
            uploadWithChunks: function() {
                this.log('🔄 ใช้วิธี Chunk Upload', 'info');
                
                const file = this.selectedFile;
                const totalChunks = Math.ceil(file.size / this.CHUNK_SIZE);
                
                this.log(`📦 แบ่งเป็น ${totalChunks} chunks`, 'info');
                
                let currentChunk = 0;
                const uploadNextChunk = () => {
                    if (currentChunk >= totalChunks) {
                        this.log('✅ อัพโหลดทั้งหมดสำเร็จ', 'success');
                        this.showUploadResult('success', 'Chunk Upload สำเร็จ!');
                        this.isUploading = false;
                        return;
                    }
                    
                    const start = currentChunk * this.CHUNK_SIZE;
                    const end = Math.min(start + this.CHUNK_SIZE, file.size);
                    const chunk = file.slice(start, end);
                    
                    // อัพเดต progress
                    const progress = Math.round((currentChunk / totalChunks) * 100);
                    document.getElementById('progress-bar').style.width = `${progress}%`;
                    
                    this.log(`📤 อัพโหลด chunk ${currentChunk + 1}/${totalChunks}`, 'info');
                    
                    // ส่ง chunk (จำลอง)
                    setTimeout(() => {
                        currentChunk++;
                        uploadNextChunk();
                    }, 500); // จำลอง network delay
                };
                
                uploadNextChunk();
            },
            
            // 2. อัพโหลดแบบ FormData (รองรับหลายเบราว์เซอร์)
            uploadWithFormData: function() {
                this.log('📤 ใช้วิธี FormData', 'info');
                
                const formData = new FormData();
                formData.append('file', this.selectedFile);
                formData.append('action', 'uploadTest');
                formData.append('timestamp', new Date().toISOString());
                formData.append('isMobile', true);
                
                // จำลองการส่ง
                this.simulateUploadProgress();
                
                // ในสภาพจริง:
                /*
                fetch(this.API_URL, {
                    method: 'POST',
                    body: formData,
                    mode: 'no-cors'
                })
                .then(response => {
                    // handle response
                })
                .catch(error => {
                    this.handleUploadError(error);
                });
                */
            },
            
            // 3. อัพโหลดแบบ Base64 (วิธีเดิมที่อาจมีปัญหา)
            uploadWithBase64: function() {
                this.log('🔢 ใช้วิธี Base64 (เสี่ยง)', 'warning');
                
                const reader = new FileReader();
                
                reader.onloadstart = () => {
                    this.log('กำลังอ่านไฟล์เป็น Base64...', 'info');
                    document.getElementById('progress-bar').style.width = '30%';
                };
                
                reader.onprogress = (e) => {
                    if (e.lengthComputable) {
                        const percent = Math.round((e.loaded / e.total) * 100);
                        document.getElementById('progress-bar').style.width = `${30 + (percent * 0.7)}%`;
                    }
                };
                
                reader.onload = (e) => {
                    const base64 = e.target.result;
                    const base64Data = base64.split(',')[1];
                    
                    this.log(`✅ อ่านไฟล์สำเร็จ: ${base64Data.length} characters`, 'success');
                    document.getElementById('progress-bar').style.width = '100%';
                    
                    // ตรวจสอบขนาด
                    if (base64Data.length > 5 * 1024 * 1024) { // 5MB base64
                        this.log('⚠️ Base64 ใหญ่เกินไปสำหรับมือถือ', 'warning');
                        this.showUploadResult('warning', 'ไฟล์ใหญ่เกินไป! แนะนำใช้วิธีอื่น');
                    } else {
                        this.showUploadResult('success', 'Base64 สำเร็จ (แต่ไม่แนะนำสำหรับมือถือ)');
                    }
                    
                    this.isUploading = false;
                };
                
                reader.onerror = (e) => {
                    this.log(`❌ อ่านไฟล์ล้มเหลว: ${e.target.error}`, 'error');
                    this.showUploadResult('error', 'FileReader ล้มเหลว!');
                    this.isUploading = false;
                };
                
                reader.readAsDataURL(this.selectedFile);
            },
            
            // ====================================================
            // ✅ ทดสอบ Solution
            // ====================================================
            
            // อัพโหลดแบบบีบอัด
            testCompressedUpload: function() {
                if (!this.selectedFile) {
                    this.showAlert('กรุณาเลือกไฟล์ก่อน');
                    return;
                }
                
                this.log('🗜️ ทดสอบบีบอัดภาพ...', 'info');
                const resultBox = document.getElementById('solution-result');
                
                if (!this.selectedFile.type.startsWith('image/')) {
                    resultBox.innerHTML = '<div class="warning">⚠️ ไฟล์นี้ไม่ใช่ภาพ</div>';
                    return;
                }
                
                // บีบอัดภาพ
                this.compressImage(this.selectedFile, 0.5).then(compressedFile => {
                    const reduction = Math.round((1 - compressedFile.size / this.selectedFile.size) * 100);
                    
                    resultBox.innerHTML = `
                        <div class="success">
                            ✅ บีบอัดสำเร็จ!<br>
                            📦 เดิม: ${this.formatBytes(this.selectedFile.size)}<br>
                            📦 ใหม่: ${this.formatBytes(compressedFile.size)}<br>
                            📉 ลดลง: ${reduction}%<br>
                            💡 เหมาะสำหรับมือถือ!
                        </div>
                    `;
                    
                    this.log(`📉 บีบอัดสำเร็จ: ลดลง ${reduction}%`, 'success');
                }).catch(error => {
                    resultBox.innerHTML = `<div class="error">❌ บีบอัดล้มเหลว: ${error.message}</div>`;
                });
            },
            
            // บีบอัดภาพ
            compressImage: function(file, quality = 0.7) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    
                    reader.onload = (e) => {
                        const img = new Image();
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            const ctx = canvas.getContext('2d');
                            
                            // คำนวณขนาดใหม่ (max 800px)
                            const maxSize = 800;
                            let width = img.width;
                            let height = img.height;
                            
                            if (width > height) {
                                if (width > maxSize) {
                                    height = Math.round((height * maxSize) / width);
                                    width = maxSize;
                                }
                            } else {
                                if (height > maxSize) {
                                    width = Math.round((width * maxSize) / height);
                                    height = maxSize;
                                }
                            }
                            
                            canvas.width = width;
                            canvas.height = height;
                            ctx.drawImage(img, 0, 0, width, height);
                            
                            canvas.toBlob((blob) => {
                                const compressedFile = new File([blob], file.name, {
                                    type: 'image/jpeg',
                                    lastModified: Date.now()
                                });
                                resolve(compressedFile);
                            }, 'image/jpeg', quality);
                        };
                        
                        img.onerror = reject;
                        img.src = e.target.result;
                    };
                    
                    reader.onerror = reject;
                    reader.readAsDataURL(file);
                });
            },
            
            // อัพโหลดแบบ Resume
            testResumeUpload: function() {
                this.log('⏯️ ทดสอบ Resume Upload...', 'info');
                const resultBox = document.getElementById('solution-result');
                
                resultBox.innerHTML = `
                    <div class="success">
                        ✅ Resume Upload Feature<br><br>
                        <strong>วิธีทำงาน:</strong><br>
                        1. แบ่งไฟล์เป็น chunks<br>
                        2. บันทึก progress แต่ละ chunk<br>
                        3. ถ้าขัดข้อง ให้เริ่มจาก chunk ถัดไป<br><br>
                        <strong>เหมาะสำหรับ:</strong><br>
                        • เครือข่ายไม่เสถียร<br>
                        • ไฟล์ขนาดใหญ่<br>
                        • มือถือที่สลับเครือข่ายบ่อย
                    </div>
                `;
            },
            
            // อัพโหลดแบบ Background
            testBackgroundUpload: function() {
                this.log('📱 ทดสอบ Background Upload...', 'info');
                const resultBox = document.getElementById('solution-result');
                
                // ตรวจสอบ Background Sync
                if ('serviceWorker' in navigator && 'SyncManager' in window) {
                    resultBox.innerHTML = `
                        <div class="success">
                            ✅ รองรับ Background Sync!<br><br>
                            <strong>สามารถ:</strong><br>
                            • อัพโหลดเมื่อกลับมาออนไลน์<br>
                            • อัพโหลดในพื้นหลัง<br>
                            • รองรับ Offline First
                        </div>
                    `;
                } else {
                    resultBox.innerHTML = `
                        <div class="warning">
                            ⚠️ ไม่รองรับ Background Sync<br><br>
                            <strong>ใช้วิธีนี้แทน:</strong><br>
                            1. ใช้ localStorage บันทึกข้อมูล<br>
                            2. ใช้ setTimeout retry<br>
                            3. แจ้งเตือนเมื่อสำเร็จ
                        </div>
                    `;
                }
            },
            
            // ====================================================
            // 🛠️ Utility Functions
            // ====================================================
            
            // จำลองการอัพโหลด
            simulateUploadProgress: function() {
                let progress = 0;
                const interval = setInterval(() => {
                    progress += 5;
                    document.getElementById('progress-bar').style.width = `${progress}%`;
                    
                    if (progress >= 100) {
                        clearInterval(interval);
                        this.showUploadResult('success', 'FormData Upload สำเร็จ!');
                        this.isUploading = false;
                    }
                }, 200);
            },
            
            // แสดงผลอัพโหลด
            showUploadResult: function(type, message) {
                const resultBox = document.getElementById('upload-result');
                const className = type === 'success' ? 'success' : 
                                type === 'error' ? 'error' : 'warning';
                
                resultBox.innerHTML = `<div class="${className}">${message}</div>`;
                this.log(`📤 Upload: ${message}`, type);
            },
            
            // จัดการ error
            handleUploadError: function(error) {
                this.log(`❌ Upload Error: ${error.message}`, 'error');
                this.showUploadResult('error', `ข้อผิดพลาด: ${error.message}`);
                this.isUploading = false;
            },
            
            // แสดง alert
            showAlert: function(message) {
                alert(message);
                this.log(`⚠️ Alert: ${message}`, 'warning');
            },
            
            // Log function
            log: function(message, type = 'info') {
                const timestamp = new Date().toLocaleTimeString('th-TH', {
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                });
                
                const logEntry = `[${timestamp}] ${message}`;
                this.logs.push({ message: logEntry, type });
                
                // แสดงใน console
                console.log(`[${type.toUpperCase()}] ${logEntry}`);
                
                // อัพเดต log output
                this.updateLogOutput();
            },
            
            // อัพเดต log output
            updateLogOutput: function() {
                const logOutput = document.getElementById('log-output');
                if (!logOutput) return;
                
                const recentLogs = this.logs.slice(-20);
                
                let html = '';
                recentLogs.forEach(log => {
                    const className = log.type === 'success' ? 'success' : 
                                    log.type === 'error' ? 'error' : 
                                    log.type === 'warning' ? 'warning' : '';
                    
                    html += `<div class="${className}">${log.message}</div>`;
                });
                
                logOutput.innerHTML = html;
                logOutput.scrollTop = logOutput.scrollHeight;
            },
            
            // ล้าง log
            clearLog: function() {
                this.logs = [];
                document.getElementById('log-output').innerHTML = '<div class="success">Log cleared</div>';
                this.log('🗑️ ล้าง Log', 'info');
            },
            
            // Format bytes
            formatBytes: function(bytes) {
                if (bytes === 0) return '0 Bytes';
                const k = 1024;
                const sizes = ['Bytes', 'KB', 'MB', 'GB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
            }
        };
        
        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            mobileUploadFix.init();
        });
        
        // Global functions
        window.testMemoryLimit = mobileUploadFix.testMemoryLimit.bind(mobileUploadFix);
        window.testFileReaderLimit = mobileUploadFix.testFileReaderLimit.bind(mobileUploadFix);
        window.testNetworkIssues = mobileUploadFix.testNetworkIssues.bind(mobileUploadFix);
        window.selectFile = mobileUploadFix.selectFile.bind(mobileUploadFix);
        window.uploadWithMethod = mobileUploadFix.uploadWithMethod.bind(mobileUploadFix);
        window.testCompressedUpload = mobileUploadFix.testCompressedUpload.bind(mobileUploadFix);
        window.testResumeUpload = mobileUploadFix.testResumeUpload.bind(mobileUploadFix);
        window.testBackgroundUpload = mobileUploadFix.testBackgroundUpload.bind(mobileUploadFix);
        window.clearLog = mobileUploadFix.clearLog.bind(mobileUploadFix);
        
        console.log('🚨 Mobile Upload Fix Ready');
    </script>
</body>
